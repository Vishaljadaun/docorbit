name: Diagnose Instagram photo availability (no download)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-instagram-photo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public Instagram post endpoints without downloading media
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error
          from html import unescape
          from urllib.parse import urlsplit

          shortcode = "De8-ux4MRVs"
          root = "https://www.instagram.com/p/" + shortcode + "/"
          endpoints = {
             "canonical": root,
             "with-original-tracking": root + "?utm_source=ig_web_copy_link&cplk=NTc4MTIwNjQ2YQ==",
             "embed": root + "embed/",
             "embed-captioned": root + "embed/captioned/",
             "direct-media": root + "media/?size=l",
             "public-json": root + "?__a=1&__d=dis",
          }
          for label,url in endpoints.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","Accept":"text/html,application/json,image/avif,image/webp,image/*,*/*;q=0.8"})
              with urllib.request.urlopen(req, timeout=16) as response:
                raw=response.read(500000)
                code=response.status
                final=response.url
                mime=response.headers.get('Content-Type','').split(';')[0]
              body=raw.decode('utf-8','ignore')
              meta=re.findall(r'<meta[^>]+(?:og:image|twitter:image)[^>]*>',body,re.I)
              image_candidates=re.findall(r'https?[^\\s"\\]{15,300}?\\.(?:jpg|jpeg|png|webp)(?:\\?[^\\s"\\]{0,100})?',body,re.I)
              print(label,'status',code,'mime',mime,'bytes-sampled',len(raw),'final-host',urlsplit(final).hostname,'redirect-login',('/accounts/login' in final),'meta-image-count',len(meta),'image-candidates',len(image_candidates),flush=True)
            except urllib.error.HTTPError as error:
              print(label,'HTTP',error.code,'mime',error.headers.get('Content-Type','')[:50],flush=True)
            except Exception as error:
              print(label,'network',type(error).__name__,flush=True)
          PY
