name: Verify live media preview and download

on:
  push:
    branches: [main]
    paths: ['.github/workflows/media-preview-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check real photo preview remains available before download
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          origin = "https://docorbit-media.onrender.com"
          post = "https://www.instagram.com/p/De8-ux4MRVs/"
          request=Request(origin+"/api/media/download",data=json.dumps({"url":post,"quality":"best"}).encode(),
              method="POST",headers={"Content-Type":"application/json","Accept":"application/json"})
          with urlopen(request,timeout=95) as response:
              payload=json.load(response)
          assert payload.get("status")=="ready",payload.get("status")
          preview=payload.get("previewUrl")
          download=payload.get("url")
          assert preview.startswith("/api/media/preview/"),"No inline preview URL"
          assert download.startswith("/api/media/file/"),"No download URL"
          with urlopen(origin+preview,timeout=25) as response:
              media_type=response.headers.get("Content-Type","")
              photo=response.read(1024*1024)
          assert media_type.startswith("image/jpeg"),media_type
          assert photo.startswith(bytes.fromhex("ffd8ff")),"Preview was not a JPEG"
          with urlopen(origin+download,timeout=25) as response:
              downloaded=response.read(1024*1024)
          assert downloaded==photo,"Preview consumed or changed downloaded file"
          print("PASS preview and download: identical JPEG bytes:",len(downloaded),flush=True)
          PY
