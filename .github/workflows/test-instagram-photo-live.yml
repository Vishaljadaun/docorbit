name: Validate live Instagram photo download

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-instagram-photo-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the exact photo link via deployed one-button endpoint
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          from urllib.parse import urljoin
          base='https://docorbit-media.onrender.com'
          source='https://www.instagram.com/p/De8-ux4MRVs/?utm_source=ig_web_copy_link&cplk=NTc4MTIwNjQ2YQ=='
          req=urllib.request.Request(base+'/api/media/download',method='POST',headers={
            'Accept':'application/json','Content-Type':'application/json'
          },data=json.dumps({'url':source,'quality':'best'}).encode())
          try:
              with urllib.request.urlopen(req,timeout=80) as response:
                  status=response.status
                  body=response.read(4096)
          except urllib.error.HTTPError as error:
              status=error.code
              body=error.read(4096)
          print('download endpoint HTTP',status,flush=True)
          try: payload=json.loads(body)
          except ValueError: raise RuntimeError('Unexpected non-JSON response')
          print('result-status:',payload.get('status'), 'filename:',payload.get('filename'),flush=True)
          if status!=200 or payload.get('status')!='ready':
              print('failure-category:',str(payload.get('detail','unknown'))[:190],flush=True)
              raise RuntimeError('Photo endpoint did not return a usable file')
          link=payload.get('url','')
          if not isinstance(link,str) or not link.startswith('/api/media/file/'):
              raise RuntimeError('Unexpected media location')
          with urllib.request.urlopen(base+link,timeout=30) as file:
              data=file.read(1024*1024)
              mime=file.headers.get('Content-Type','')
          print('image-bytes',len(data),'JPEG-header',data.startswith(bytes.fromhex('ffd8ff')),'content-type',mime,flush=True)
          if len(data)<1000 or not data.startswith(bytes.fromhex('ffd8ff')):
              raise RuntimeError('Retrieved content is not a valid JPEG response')
          print('PASS: Exact tracked Instagram post resolved and yielded real JPEG data',flush=True)
          PY
